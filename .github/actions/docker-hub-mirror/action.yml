name: Espelho do Docker Hub
description: Faz o daemon do runner puxar as imagens do Docker Hub pelo mirror.gcr.io, com o Docker Hub como fallback

runs:
  using: composite
  steps:
    # WHY: os testes e o smoke puxam várias imagens do Docker Hub por execução, e o limite anônimo do Hub derruba o job.
    - name: Registry mirror no daemon
      shell: bash
      run: |
        set -euo pipefail
        config=/etc/docker/daemon.json
        current='{}'
        if [[ -f "$config" ]]; then current="$(sudo cat "$config")"; fi
        jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' <<<"$current" | sudo tee "$config" > /dev/null
        sudo systemctl restart docker
        docker info --format 'registry mirrors: {{json .RegistryConfig.Mirrors}}'
