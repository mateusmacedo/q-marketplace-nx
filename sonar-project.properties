# Análise do SonarQube Cloud (ADR 032). O workflow sonar.yml gera a cobertura e passa o que depende do runner: as pastas
# de bytecode dos módulos Java e as bibliotecas do cache do Gradle.
sonar.organization=mateusmacedo
sonar.projectKey=q-marketplace-nx
sonar.projectName=q-marketplace-nx
sonar.sourceEncoding=UTF-8
# WHY: sem a versão, o Sonar supõe Java 8 e deixa de aplicar as regras do Java 21 do build.
sonar.java.source=21

sonar.sources=apps,libs,tools
sonar.tests=apps,libs,tools
sonar.test.inclusions=**/src/test/**,**/*.spec.ts,**/*.test.mjs,apps/admin-web-e2e/**
# WHY: o cliente de libs/catalog-inventory/admin/data-access é gerado do contrato; o achado nele não tem onde ser
# corrigido.
sonar.exclusions=**/src/test/**,**/*.spec.ts,**/*.test.mjs,apps/admin-web-e2e/**,**/src/generated/**,**/build/**

sonar.coverage.jacoco.xmlReportPaths=apps/*/build/reports/jacoco/test/jacocoTestReport.xml,libs/*/*/build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=coverage/**/lcov.info
sonar.coverage.exclusions=tools/**,**/*.config.ts,**/*.config.mts,**/*.config.mjs,**/test-setup.ts
