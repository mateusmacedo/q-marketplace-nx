# Textos dos códigos de recusa do catálogo, em português (UTF-8). A chave <código> não leva parâmetros; a chave
# <código>.<n> vale para o motivo com n parâmetros, na ordem em que o emissor os monta ({0}, {1}...). Todo código dos
# registros DomainReasons, ApplicationReasons e ImportFileReasons precisa da chave sem parâmetros.

invalid-value=Há um valor inválido nos dados enviados.
