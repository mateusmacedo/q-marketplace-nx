quarkus.application.name=catalog-inventory-service
quarkus.http.port=8083
quarkus.http.test-port=0
quarkus.http.limits.max-body-size=1M
# Abaixo do terminationGracePeriodSeconds padrão do Kubernetes (30s), para drenar requisições em andamento.
quarkus.shutdown.timeout=25S
# Propriedade de build. WHY: sem teto, o native-image se dimensiona pela RAM da máquina; ao lado da stack local, o build
# esgotou 14 GiB e o OOM killer derrubou a IDE.
quarkus.native.native-image-xmx=5g
# Catálogo de mensagens das recusas, lido como recurso pelo adaptador HTTP; a imagem nativa só embute o que é listado.
quarkus.native.resources.includes=i18n/**

# Em dev/test os Dev Services sobem um PostgreSQL efêmero; o Quarkus não os usa em produção.
quarkus.datasource.devservices.image-name=postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea

# Banco: requisições usam o cliente reativo (QUARKUS_DATASOURCE_REACTIVE_URL, ex.: postgresql://host:5432/marketplace).
# O JDBC (QUARKUS_DATASOURCE_JDBC_URL) existe só para o Flyway no boot. QUARKUS_DATASOURCE_USERNAME/PASSWORD levam o
# role de runtime, só com DML; o Flyway migra com o dono do schema (QUARKUS_FLYWAY_USERNAME/PASSWORD) e, sem eles,
# com o do datasource, como nos Dev Services.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=2
quarkus.flyway.migrate-at-start=true
# Schema do contexto no banco compartilhado (ADR 019), trocável por QUARKUS_FLYWAY_SCHEMAS. WHY: cada conexão reativa
# leva o search_path, sem depender da configuração do role, para valer igual nos Dev Services e em produção.
quarkus.flyway.schemas=catalog_inventory
quarkus.datasource.reactive.additional-properties.search_path=${quarkus.flyway.schemas}

# Agendadores ("off" desliga): varredor de reservas vencidas, relay da outbox, limpeza de outbox e inbox, processador
# de importações de produtos e gauges de SKUs (ADR 017; em teste, o relay segue ligado e os demais são disparados
# pelos testes). Só o papel worker os executa (ADR 020). Os demais
# parâmetros têm padrão em CatalogConfig e aceitam a variável de ambiente correspondente (CATALOG_EVENTS_PRODUCT_TOPIC etc.).
catalog.reservations.sweep-interval=5s
catalog.events.relay-interval=1s
catalog.events.purge-interval=1m
catalog.imports.interval=1s
catalog.metrics.refresh-interval=60s
%test.catalog.reservations.sweep-interval=off
%test.catalog.events.purge-interval=off
%test.catalog.imports.interval=off
%test.catalog.metrics.refresh-interval=off

# Papéis (ADR 020): o mesmo executável roda como api ou worker, escolhido pelo perfil (QUARKUS_PROFILE=prod,api ou
# prod,worker); sem papel, como em dev e test, tudo roda no mesmo processo. A api atende HTTP e grava na outbox, sem
# tarefas agendadas nem Kafka; o worker roda as tarefas e o Kafka, sem a porta HTTP de negócio.
%api.quarkus.otel.service.name=catalog-inventory-api
%api.catalog.reservations.sweep-interval=off
%api.catalog.events.relay-interval=off
%api.catalog.events.purge-interval=off
%api.catalog.imports.interval=off
%api.catalog.metrics.refresh-interval=off
%api.mp.messaging.outgoing.catalog-events.enabled=false
%api.mp.messaging.incoming.kyb-seller-verdicts.enabled=false
%worker.quarkus.otel.service.name=catalog-inventory-worker
%worker.quarkus.http.host-enabled=false
# Saúde e métricas na porta de gestão (9000), a única que o worker abre; propriedade de build, e nos testes elas ficam
# na porta principal.
quarkus.management.enabled=true
%test.quarkus.management.enabled=false

# Eventos (ADR 013): a outbox é publicada no Kafka pelo relay e os vereditos KYB/KYC são consumidos com inbox.
# Produção exige KAFKA_BOOTSTRAP_SERVERS; em dev/test os Dev Services sobem um Kafka efêmero.
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
%test.catalog.events.consumer-retries=2
mp.messaging.outgoing.catalog-events.connector=smallrye-kafka
# O tópico de cada evento vem da outbox, nos metadados da mensagem.
mp.messaging.outgoing.catalog-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.catalog-events.acks=all
mp.messaging.outgoing.catalog-events.enable.idempotence=true
# WHY: em dev e teste, o Quarkus define close-timeout=0 nos canais de saída, e o SmallRye recusa zero ao fechar o
# produtor (o erro só sai em DEBUG): o produtor da app parada seguia tentando o broker removido até a JVM terminar.
%dev,test.mp.messaging.outgoing.catalog-events.close-timeout=1000
mp.messaging.incoming.kyb-seller-verdicts.connector=smallrye-kafka
mp.messaging.incoming.kyb-seller-verdicts.topic=${CATALOG_KYB_SELLER_TOPIC:kyb-kyc.seller.v1}
# WHY: grupo explícito, para renomear a aplicação não mover os offsets do consumidor.
mp.messaging.incoming.kyb-seller-verdicts.group.id=catalog-inventory-service
mp.messaging.incoming.kyb-seller-verdicts.auto.offset.reset=earliest
mp.messaging.incoming.kyb-seller-verdicts.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.kyb-seller-verdicts.failure-strategy=dead-letter-queue
mp.messaging.incoming.kyb-seller-verdicts.dead-letter-queue.topic=${CATALOG_KYB_SELLER_DLQ:catalog-inventory.kyb-seller.dlq}

# Cache Redis da vitrine e da taxonomia (ADR 024), nos dois papéis, desligado por padrão: no A/B da carga average ele
# deixou as leituras mais lentas sem aliviar o banco. CATALOG_CACHE_ENABLED=true liga e exige QUARKUS_REDIS_HOSTS
# (redis://<usuário da ACL>@host:6379) e QUARKUS_REDIS_PASSWORD; nos testes fica ligado, com Redis dos Dev Services.
# Validade e prazos têm padrão em CatalogConfig (CATALOG_CACHE_TTL, _TIMEOUT, _INVALIDATION_TIMEOUT, _GENERATION_TTL).
%prod.catalog.cache.enabled=${CATALOG_CACHE_ENABLED:false}
%dev.catalog.cache.enabled=${CATALOG_CACHE_ENABLED:false}
quarkus.redis.devservices.image-name=redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
# Propriedade de build. WHY: dependência opcional; com o Redis fora, a leitura vai ao banco e o pod segue pronto.
quarkus.redis.health.enabled=false
# WHY: o pool padrão (6 conexões e 24 na fila) recusa acima de 30 comandos simultâneos; a fila maior fica limitada
# pelo prazo de cada comando do cache.
quarkus.redis.max-pool-size=16
quarkus.redis.max-pool-waiting=256

# Segurança: tokens JWT emitidos pelo provedor OIDC; endpoints sem anotação de segurança são negados.
quarkus.security.jaxrs.deny-unannotated-endpoints=true
smallrye.jwt.path.groups=${CATALOG_JWT_GROUPS_PATH:groups}
mp.jwt.verify.issuer=${CATALOG_JWT_ISSUER}
mp.jwt.verify.audiences=${CATALOG_JWT_AUDIENCE}
# WHY: a chave é declarada só em prod/dev; em teste, sem chave configurada, a extensão gera um par RSA efêmero.
%prod.mp.jwt.verify.publickey.location=${CATALOG_JWT_JWKS_URL}
%dev.mp.jwt.verify.issuer=${CATALOG_JWT_ISSUER:http://localhost:8180/realms/marketplace}
%dev.mp.jwt.verify.publickey.location=${CATALOG_JWT_JWKS_URL:http://localhost:8180/realms/marketplace/protocol/openid-connect/certs}
%dev.mp.jwt.verify.audiences=${CATALOG_JWT_AUDIENCE:catalog-inventory}
%test.mp.jwt.verify.issuer=https://issuer.test
%test.mp.jwt.verify.audiences=catalog-inventory

# OpenAPI gerada do código; o contrato versionado fica em contracts/catalog-inventory/openapi.json.
quarkus.smallrye-openapi.info-title=Catalog & Inventory API
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.info-description=Categorias, produtos e SKUs, ofertas (preço e promoções), moderação, vitrine, estoque e reservas por tenant. Tenant e loja são derivados do token JWT.
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-description=Token JWT do provedor OIDC; o tenant e a loja vêm das claims tenant_id e store_id
# Swagger UI em /q/swagger-ui: incluído no build e desligado por padrão em produção (CATALOG_SWAGGER_UI_ENABLED=true liga).
quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.enabled=${CATALOG_SWAGGER_UI_ENABLED:false}

# Observabilidade: métricas em /q/metrics, na porta de gestão (9000); traces e logs OTLP ligados por QUARKUS_OTEL_SDK_DISABLED=false e QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.sdk.disabled=true
# WHY: sem service.instance.id, as métricas de instâncias diferentes (réplicas, contêiner recriado) caem na mesma série
# do Prometheus e colidem; o HOSTNAME é o pod no Kubernetes e o contêiner no compose (ADR 021).
quarkus.otel.resource.attributes=service.instance.id=${HOSTNAME:local}
# Propriedade de build: o exportador de logs entra no executável e só envia com o SDK ligado; o console continua igual.
quarkus.otel.logs.enabled=true
# Propriedade de build. WHY: as métricas saem do Micrometer em /q/metrics; com o exportador padrão, o SDK cria um leitor
# periódico de métricas mesmo com quarkus.otel.metrics.enabled=false, e cada desligamento espera 5 s por ele.
quarkus.otel.metrics.exporter=none
# Propriedade de build: autenticação e autorização, aceitas ou recusadas, viram eventos do span da requisição (ADR 021).
quarkus.otel.security-events.enabled=true
# Propriedades de build: um span e um timer (scheduled.methods) por execução de tarefa agendada (ADR 021).
quarkus.scheduler.tracing.enabled=true
quarkus.scheduler.metrics.enabled=true
# WORKAROUND(quarkusio/quarkus#55855): o sampler de exemplars do Micrometer gera aviso falso de uso da API OpenTelemetry
# no boot; corrigido só na linha 4.0. Remover ao atualizar o Quarkus.
quarkus.log.category."io.opentelemetry.usage".level=ERROR
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
