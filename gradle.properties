# Gradle properties

quarkusPluginVersion=3.40.1.1
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.40.1.1

org.gradle.workers.max=2
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
# O gradlew e cada servidor de linguagem Java aberto no projeto sobem o seu daemon, por usarem JDKs diferentes; com o
# padrão de 3 h ocioso, eles se acumulam e esgotam a memória do host (README, "Memória do host").
org.gradle.daemon.idletimeout=900000
