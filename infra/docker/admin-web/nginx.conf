# Painel na porta 8080 da imagem sem root: só os arquivos estáticos, com as rotas do Angular caindo no index.html.
# O caminho /api/<contexto> é do ingress em produção e do gateway no ambiente local (infra/local/gateway/nginx.conf).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Redirecionamentos relativos: a porta publicada pode não ser a 8080 do container.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # O index.html sempre revalidado; os bundles têm hash no nome e mudam a cada build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
