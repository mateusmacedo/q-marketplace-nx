# Painel na porta 8080 da imagem sem root. As rotas do Angular caem no index.html, e /api/catalog-inventory vai ao
# catalog-api sem o prefixo, como no proxy do dev server (apps/admin-web/proxy.conf.json).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # WHY: com o upstream numa variável e o DNS do Docker, o nginx sobe mesmo antes do catalog-api e responde 502
    # até ele ficar pronto, em vez de falhar no boot.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $catalog_inventory http://catalog-api:8080;

    location /api/catalog-inventory/ {
        rewrite ^/api/catalog-inventory/(.*)$ /$1 break;
        proxy_pass $catalog_inventory;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # O index.html sempre revalidado; os bundles têm hash no nome e mudam a cada build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
