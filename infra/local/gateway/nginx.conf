# Gateway local, incluído no bloco http do nginx. Cada contexto tem um upstream com as suas instâncias e failover
# passivo: a requisição que falha na conexão ou volta 502/503 segue para a outra instância, menos POST e PATCH, que o
# nginx não repete. O cabeçalho X-Upstream mostra qual instância respondeu.
resolver 127.0.0.11 valid=10s ipv6=off;

proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 2s;
proxy_next_upstream error timeout http_502 http_503;
add_header X-Upstream $upstream_addr always;

upstream catalog_inventory {
    zone catalog_inventory 64k;
    # WHY: com resolve, o nginx sobe e continua resolvendo os nomes mesmo com uma instância fora do ar.
    server catalog-api-1:8080 resolve max_fails=1 fail_timeout=10s;
    server catalog-api-2:8080 resolve max_fails=1 fail_timeout=10s;
}

# Painel e /api/<contexto>, a mesma origem que o ingress dará em produção.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/catalog-inventory/ {
        proxy_pass http://catalog_inventory/;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# API do catálogo (contexto 3) para curl, Swagger UI e a suíte de carga, pelo mesmo balanceamento.
server {
    listen 8083;
    server_name _;

    location / {
        proxy_pass http://catalog_inventory;
    }
}
