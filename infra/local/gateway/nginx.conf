# Gateway local, incluído no bloco http do nginx. Cada contexto tem um upstream com as suas instâncias e failover
# passivo: conexão recusada ou sem resposta em 2 s segue para a outra instância, inclusive POST e PATCH, que ainda não
# chegaram ao serviço; depois de enviados, eles não se repetem. O cabeçalho X-Upstream mostra qual instância respondeu.
resolver 127.0.0.11 valid=10s ipv6=off;
server_tokens off;
absolute_redirect off;

# $http_host mantém a porta pedida, que o serviço usa no Location das respostas 201.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 2s;
# WHY: sem http_503, o 503 com Retry-After que o catálogo devolve quando uma dependência demora chega ao cliente e não
# tira a instância do rodízio; com ele, as duas instâncias podiam sair juntas por 10 s.
proxy_next_upstream error timeout;
proxy_http_version 1.1;
proxy_set_header Connection "";
add_header X-Upstream $upstream_addr always;

upstream catalog_inventory {
    zone catalog_inventory 64k;
    # WHY: com resolve, o nginx sobe e continua resolvendo os nomes mesmo com uma instância fora do ar.
    server catalog-api-1:8080 resolve max_fails=1 fail_timeout=10s;
    server catalog-api-2:8080 resolve max_fails=1 fail_timeout=10s;
    keepalive 32;
}

# Painel e /api/<contexto>, a mesma origem que o ingress dará em produção.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/catalog-inventory/ {
        proxy_pass http://catalog_inventory/;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# API do catálogo (contexto 3) para curl e a suíte de carga, pelo mesmo balanceamento.
server {
    listen 8083;
    server_name _;

    location / {
        proxy_pass http://catalog_inventory;
    }
}
