# Gateway local (ADR 019 e ADR 027): o nginx da imagem do painel, com a configuração de infra/local/gateway montada.
# Serve o painel e /api/<contexto> na 8080, na mesma origem do navegador, e a API de cada contexto, balanceada entre as
# instâncias, na 808c (c = índice do contexto; 8083 é o catálogo). A imagem leva o build de
# `npx nx run admin-web:build`, que precisa existir antes do `up --build`. O hot reload fica no `npm run dev:admin`.
services:
  gateway:
    build:
      context: ../../..
      dockerfile: infra/docker/Dockerfile.admin-web
    image: marketplace-nx/admin-web:local
    profiles: [catalog, all]
    depends_on:
      catalog-api-1: { condition: service_healthy }
      catalog-api-2: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 64M }
        reservations: { memory: 16M }
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
      - "127.0.0.1:${CATALOG_PORT:-8083}:8083"
    volumes: ["../gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
