services:
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    deploy:
      resources:
        limits: { cpus: "0.35", memory: 1G }
        reservations: { memory: 256M }
    profiles: [observability, all]
    # OTLP para as séries que o Collector deriva dos spans; remote write para o k6; exemplars para ir da métrica ao
    # trace.
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
      - --enable-feature=exemplar-storage
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      # WHY: a pasta, e não o arquivo: o bind de arquivo único fica preso ao arquivo antigo quando um editor o troca
      # inteiro, e o /-/reload continuaria lendo a versão anterior.
      - ../../observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/ready | grep -q Ready"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  prometheus-data: {}
