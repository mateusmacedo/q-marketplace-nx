# Painel (ADR 027) no nginx sem root, com o build de `npx nx run admin-web:build`; o mesmo nginx leva
# /api/catalog-inventory ao catalog-api, na mesma origem. O hot reload fica no `npm run dev:admin`, fora do compose.
services:
  admin-web:
    build:
      context: ../../..
      dockerfile: infra/docker/Dockerfile.admin-web
    image: marketplace-nx/admin-web:local
    profiles: [catalog, all]
    depends_on:
      catalog-api: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.05", memory: 64M}
        reservations: {cpus: "0.01", memory: 16M}
    ports: ["127.0.0.1:${ADMIN_WEB_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
