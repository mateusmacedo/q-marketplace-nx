# Único serviço com o socket do Docker, que ele lê para descobrir e seguir os logs dos contêineres.
services:
  alloy:
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    deploy:
      resources:
        limits: { cpus: "0.15", memory: 384M }
        reservations: { memory: 64M }
    profiles: [observability, all]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/alloy-docker.alloy
    user: root
    volumes:
      # WHY: a pasta, e não o arquivo: o bind de arquivo único fica preso ao arquivo antigo quando um editor o troca
      # inteiro, e o restart continuaria lendo a versão anterior.
      - ../../observability/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

volumes:
  alloy-data: {}
