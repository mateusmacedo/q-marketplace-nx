# Exporters dos recursos sem métricas próprias. Sem depends_on, porque o banco e o Redis sobem por outros profiles: até
# existirem, os exporters respondem pg_up 0 e redis_up 0.
services:
  # Com o role exporter (pg_monitor) que o postgres-init cria: lê estatísticas de todos os bancos, sem acesso aos dados.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    deploy:
      resources:
        limits: {cpus: "0.05", memory: 64M}
        reservations: {cpus: "0.01", memory: 16M}
    profiles: [observability, all]
    environment:
      DATA_SOURCE_NAME: postgresql://exporter:${POSTGRES_EXPORTER_PASSWORD:-exporter-local-postgres}@postgres:5432/marketplace?sslmode=disable

  # Memória, evicções, comandos, latência e clientes do Redis do cache (ADR 024), com o usuário exporter da ACL.
  redis-exporter:
    image: oliver006/redis_exporter:v1.91.1@sha256:c67a432dba6b4ae30f471e3c77cf14a289133bbeeb89abb0bb03e6092efb2836
    deploy:
      resources:
        limits: {cpus: "0.05", memory: 64M}
        reservations: {cpus: "0.01", memory: 16M}
    profiles: [observability, all]
    command: ["--redis.addr=redis://redis:6379", "--redis.user=exporter"]
    environment:
      REDIS_PASSWORD: ${REDIS_EXPORTER_PASSWORD:-exporter-local-redis}

  # CPU, memória, rede e disco por contêiner. Só os do Docker e sem os grupos por CPU, processo e socket: sem isso o
  # cAdvisor segue todo cgroup do host e a memória dele dispara.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1@sha256:f40e65878e25c2e78ea037f73a449527a0fb994e303dc3e34cb6b187b4b91435
    deploy:
      resources:
        limits: {cpus: "0.15", memory: 256M}
        reservations: {cpus: "0.02", memory: 64M}
    profiles: [observability, all]
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
