services:
  grafana:
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    deploy:
      resources:
        limits: {cpus: "0.30", memory: 1280M}
        reservations: {cpus: "0.05", memory: 256M}
    profiles: [observability, all]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: system
      GF_LOG_LEVEL: warn
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    volumes:
      # WHY: a pasta, e não o arquivo: o bind de arquivo único fica preso ao arquivo antigo quando um editor o troca
      # inteiro, e o restart continuaria lendo a versão anterior.
      - ../../observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../../observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  grafana-data: {}
