# Tempo 3.x: `ingester`, `compactor` e `metrics_generator.traces_storage` saíram de
# app.Config (live store + block builder); declará-los derruba o processo na partida.
# Sem metrics_generator: as séries por span e o mapa de serviços vêm do Collector, de todos os spans, antes da
# amostragem (ADR 021).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
