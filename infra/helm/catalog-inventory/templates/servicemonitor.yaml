{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "catalog-inventory.fullname" . }}
  labels:
    {{- include "catalog-inventory.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # Seleciona o Service de métricas, que cobre a api e o worker na porta de gestão.
  selector:
    matchLabels:
      {{- include "catalog-inventory.componentSelectorLabels" (dict "root" $ "component" "metrics") | nindent 6 }}
  # WHY: leva o papel do pod para as séries, porque a api e o worker publicam métricas diferentes.
  podTargetLabels:
    - app.kubernetes.io/component
  endpoints:
    - port: management
      path: /q/metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
