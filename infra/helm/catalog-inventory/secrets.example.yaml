# Secrets que o chart lê e não cria (database.existingSecret, kafka.clientSecret e cache.existingSecret de
# values-production.example.yaml).
# Copie para fora do repositório, troque os valores e aplique antes da instalação (kubectl -n <namespace> apply -f);
# em produção, prefira um gerenciador de segredos (External Secrets, Sealed Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: catalog-inventory-db
type: Opaque
stringData:
  # Role de runtime (só DML no schema) e role dono do schema, usado só pelas migrations Flyway.
  username: catalog_inventory
  password: CHANGE_ME
  migrator-username: catalog_inventory_migrator
  migrator-password: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-inventory-kafka
type: Opaque
stringData:
  # Propriedades de cliente como variáveis do Quarkus; sem SASL/SSL, dispense este Secret e deixe kafka.clientSecret vazio.
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  KAFKA_SASL_JAAS_CONFIG: >-
    org.apache.kafka.common.security.scram.ScramLoginModule required username="catalog" password="CHANGE_ME";
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-inventory-redis
type: Opaque
stringData:
  # Senha do usuário da ACL do Redis indicado em cache.hosts; só com cache.enabled.
  password: CHANGE_ME
