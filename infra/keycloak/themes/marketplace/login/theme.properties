# Login do painel (ADR 028) no visual do template CoreUI. O CSS e os ícones do CoreUI vêm do node_modules, montados
# no tema comum "coreui" (infra/local/compose/keycloak.yml), na mesma versão do admin-web.
parent=keycloak
import=common/coreui

# WHY: o Keycloak serve os recursos do tema importado pelo caminho deste tema; o stylesCommon aponta sempre para
# common/keycloak, então fica vazio para não carregar o PatternFly do tema pai.
stylesCommon=
styles=css/coreui.min.css icons/css/free.min.css css/login.css
scripts=js/color-mode.js

kcHtmlClass=
kcBodyClass=bg-body-tertiary
kcLoginClass=min-vh-100 d-flex flex-column align-items-center justify-content-center px-3 py-4
kcHeaderClass=mb-4
kcHeaderWrapperClass=fs-4 fw-semibold text-body text-center
kcFormCardClass=card kc-card p-4
kcFormHeaderClass=mb-3 text-center
kcContentWrapperClass=
kcLabelWrapperClass=
kcFormGroupClass=mb-3
kcFormSettingClass=d-flex justify-content-between align-items-center small
kcFormOptionsClass=
kcFormOptionsWrapperClass=
kcLabelClass=form-label
kcInputClass=form-control
kcInputErrorMessageClass=invalid-feedback d-block
kcInputGroup=input-group
kcFormPasswordVisibilityButtonClass=input-group-text link-secondary
kcFormPasswordVisibilityIconShow=kc-icon-eye
kcFormPasswordVisibilityIconHide=cil-low-vision
kcButtonClass=btn
kcButtonPrimaryClass=btn-primary
kcButtonDefaultClass=btn-outline-secondary
kcButtonBlockClass=w-100
kcButtonLargeClass=
kcAlertClass=alert d-flex align-items-center gap-2
kcAlertTitleClass=
kcFeedbackErrorIcon=cil-x-circle
kcFeedbackWarningIcon=cil-warning
kcFeedbackSuccessIcon=cil-check-circle
kcFeedbackInfoIcon=cil-info
kcSignUpClass=text-center small mt-3
kcInfoAreaWrapperClass=
